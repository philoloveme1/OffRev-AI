<!-- Flashcard Display Section -->
<div id="flashcardsContainer" style="display:none; margin-top:30px;">
  <h3>📚 Your Flashcards</h3>
  <div id="cardsList"></div>
</div>

<script>
// When flashcards are generated, display them with DELETE buttons
function displayFlashcards(cards) {
  const container = document.getElementById('cardsList');
  container.innerHTML = ''; // Clear old cards

  cards.forEach((card, index) => {
    const cardElement = document.createElement('div');
    cardElement.className = 'flashcard';
    cardElement.id = `card-${index}`;
    cardElement.style.cssText = 'border:1px solid #ccc; padding:15px; margin:10px 0; border-radius:8px; background:#f9f9f9;';

    cardElement.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:flex-start;">
        <div style="flex:1;">
          <p><strong>Q${index + 1}:</strong> ${card.question}</p>
          <p><strong>A:</strong> ${card.answer}</p>
        </div>
        <button 
          onclick="deleteCard(${index})" 
          style="background:#ff4444; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; margin-left:10px;">
          🗑️ Delete
        </button>
      </div>
    `;
    container.appendChild(cardElement);
  });

  document.getElementById('flashcardsContainer').style.display = 'block';
}

// DELETE CARD FUNCTION
function deleteCard(cardIndex) {
  const card = document.getElementById(`card-${cardIndex}`);
  if (card) {
    card.style.transition = 'opacity 0.3s';
    card.style.opacity = '0';
    setTimeout(() => card.remove(), 300);
    alert('✅ Card deleted!');
  }
}
</script>
